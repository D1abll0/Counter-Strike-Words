name = "counter-strike-words"
main = "worker.js"
compatibility_date = "2026-03-24"

[observability]
enabled = true

[triggers]
crons = ["0 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "counter-strike-words"
database_id = "<second deployment step>"

[[services]]
binding = "SVG_CONVERTER"
service = "svg-converter"

[vars]
DISCORD_CLIENT_ID = ""
DISCORD_PUBLIC_KEY = ""